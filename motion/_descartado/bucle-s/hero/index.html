<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Portada · Spiralia AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #051A2B; }
    .lienzo { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  </style>
  <script src="gsap.min.js"></script>
  <script src="s-geom.js"></script>
</head>
<body>
  <!-- 24 s a 30 fps (720 fotogramas), en bucle y sin texto. Guion en hero.js -->
  <div id="hero" class="lienzo" data-composition-id="hero" data-start="0" data-duration="24" data-width="1920" data-height="1080" data-fps="30"></div>
  <script src="hero.js"></script>
  <script>
    HERO.montar(document.getElementById('hero'));
    const tl = gsap.timeline({ paused: true, onUpdate: () => HERO.pintar(tl.time()) });
    tl.to({ ancla: 0 }, { ancla: 1, duration: HERO.duracion, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["hero"] = tl;
    tl.seek(0);
    HERO.pintar(0);
  </script>
</body>
</html>
