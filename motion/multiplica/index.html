<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>La IA multiplica · Spiralia AI</title>
  <style>
    @font-face { font-family: "Butler"; src: url("Butler-Light.otf") format("opentype"); font-weight: 300; font-display: block; }
    @font-face { font-family: "Butler"; src: url("Butler-Regular.otf") format("opentype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Sofia Sans Condensed"; src: url("SofiaSansCondensed-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* El tamaño lo marca el lienzo (data-width/height); html y body no lo fijan, así sirven a los dos formatos */
    html, body { overflow: hidden; background: #051A2B; }
    .lienzo { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #E0DFDA; background: #051A2B; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    /* Profundidad: una luz marina muy baja detrás del gráfico */
    .fondo { position: absolute; inset: 0; background: radial-gradient(1300px 820px at 58% 60%, rgba(13, 49, 80, .62), rgba(13, 49, 80, 0) 72%), #051A2B; }
    .graf { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }

    /* Cabecera: líneas que suben desde una máscara (la película) */
    .cab { position: absolute; left: 160px; top: 90px; transform-origin: 0 0; }
    .mascara { overflow: hidden; padding-bottom: .08em; }
    .sube { display: block; white-space: nowrap; will-change: transform; }
    .cab .mascara { font: 300 84px/1.04 "Butler"; letter-spacing: -.01em; }
    .cab.intro .mascara { font-size: 160px; line-height: 1.02; letter-spacing: -.012em; }
    .blanco { color: #FFFFFF; }

    /* Contador: rótulo y cifra, arriba a la derecha */
    .cuenta { position: absolute; right: 160px; top: 92px; display: flex; align-items: baseline; gap: 22px; }
    .cuenta .r { font: 600 26px/1 "Sofia Sans Condensed"; letter-spacing: .2em; text-transform: uppercase; color: #A9B1B8; }
    .cuenta .n { font: 300 100px/.92 "Butler"; letter-spacing: -.02em; color: #E0DFDA; min-width: 1.12em; text-align: right; }

    /* Rótulos que siguen a las cabezas de las líneas y a la llave */
    .rot { position: absolute; left: 0; top: 0; font: 400 36px/1.14 "Butler"; white-space: nowrap; will-change: transform; }
    .rot span { display: block; }
    .rot.arriba { color: #E0DFDA; }
    .rot.abajo { color: #A9B1B8; }
    .rot.hueco { color: #E0DFDA; }

    .eje { position: absolute; right: 160px; top: 1000px; font: 600 26px/1 "Sofia Sans Condensed"; letter-spacing: .2em; text-transform: uppercase; color: #A9B1B8; }
    .ilus { position: absolute; left: 160px; top: 1000px; font: 400 26px/1 "Sofia Sans Condensed"; letter-spacing: .03em; color: #A9B1B8; opacity: .7; }

    /* Etiquetas de riesgo: tarjeta marina, borde discontinuo en blanco tenue, sombra larga y difusa */
    .riesgos { position: absolute; left: 300px; top: 866px; display: flex; gap: 20px; align-items: flex-start; }
    .riesgos .salto { display: none; }
    .riesgo { position: relative; font: 500 28px/1 "Sofia Sans Condensed"; letter-spacing: .02em; color: rgba(255, 255, 255, .8); padding: 15px 22px 16px; background: rgba(8, 38, 61, .94); border-radius: 8px; box-shadow: 0 26px 50px -18px rgba(0, 0, 0, .7); white-space: nowrap; transform-origin: 50% 0; will-change: transform; }
    .riesgo svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
    .riesgo rect { fill: none; stroke: rgba(255, 255, 255, .5); stroke-width: 1.5; stroke-dasharray: 7 6; }

    /* 4:5 (1080×1350, móvil): render_piezas.sh pone class="v" en <html>. Mismo guion y textos */
    .v .lienzo { width: 1080px; height: 1350px; }
    .v .fondo { background: radial-gradient(980px 980px at 50% 60%, rgba(13, 49, 80, .62), rgba(13, 49, 80, 0) 72%), #051A2B; }
    .v .cab { left: 84px; }
    .v .cab .mascara { font-size: 76px; }
    .v .cab.intro .mascara { font-size: 132px; }
    .v .cuenta { right: 84px; top: 380px; gap: 18px; }
    .v .cuenta .r { font-size: 30px; }
    .v .cuenta .n { font-size: 88px; }
    .v .rot { font-size: 32px; }
    .v .eje { right: 84px; top: 1248px; font-size: 30px; }
    .v .ilus { left: 84px; top: 1248px; font-size: 30px; }
    .v .riesgos { left: 140px; top: 1014px; width: 856px; flex-wrap: wrap; gap: 16px 16px; }
    .v .riesgos .salto { display: block; flex-basis: 100%; height: 0; }
    .v .riesgo { font-size: 30px; padding: 15px 22px 16px; }
  </style>
  <script src="gsap.min.js"></script>
  <script src="copy.js"></script>
</head>
<body>
  <!-- 16 s a 30 fps (480 fotogramas), 16:9 y 4:5, sin sonido. Guion en multiplica.js; textos en copy.js -->
  <div id="pieza" class="lienzo" data-composition-id="multiplica" data-start="0" data-duration="16" data-width="1920" data-height="1080" data-fps="30"></div>
  <script src="multiplica.js"></script>
  <script>
    PIEZA.montar(document.getElementById('pieza'));
    const tl = gsap.timeline({ paused: true, onUpdate: () => PIEZA.pintar(tl.time()) });
    tl.to({ ancla: 0 }, { ancla: 1, duration: PIEZA.duracion, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["multiplica"] = tl;
    tl.seek(0);
    PIEZA.pintar(0);
  </script>
</body>
</html>
