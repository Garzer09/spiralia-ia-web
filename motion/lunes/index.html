<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>El viernes y el lunes · Spiralia AI</title>
  <style>
    @font-face { font-family: "Butler"; src: url("Butler-Light.otf") format("opentype"); font-weight: 300; font-display: block; }
    @font-face { font-family: "Butler"; src: url("Butler-Regular.otf") format("opentype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Sofia Sans Condensed"; src: url("SofiaSansCondensed-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
    /* Monocromo Spiralia: noche #051A2B · navy #08263D · marino #0D3150 · azul hondo #174467 · greige #E0DFDA · papel #F5F4F0 · gris #A9B1B8 · blanco #FFFFFF (lo que se enciende) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #051A2B; }
    .lienzo { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #E0DFDA; font-family: "Sofia Sans Condensed"; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    .fondo { position: absolute; inset: 0; background: #051A2B; }
    .halo { position: absolute; left: 0; top: 0; width: 1500px; height: 1100px; margin: -550px 0 0 -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(23, 68, 103, .42), rgba(13, 49, 80, .16) 55%, rgba(5, 26, 43, 0)); will-change: transform; }
    .mascara { overflow: hidden; padding-bottom: .08em; }
    .sube { display: block; will-change: transform; }
    .rot { font: 600 26px/1 "Sofia Sans Condensed"; letter-spacing: .2em; text-transform: uppercase; }

    /* Rótulo de día y hora (rueda como un contador) */
    .dia { position: absolute; left: 160px; top: 78px; display: flex; align-items: center; gap: 24px; font: 300 64px/1 "Butler"; letter-spacing: -.005em; }
    .reloj { width: 54px; height: 54px; flex: none; overflow: visible; }
    .reloj circle { fill: none; stroke: #A9B1B8; stroke-width: 2; }
    .reloj line { stroke: #E0DFDA; stroke-width: 2.6; stroke-linecap: round; }
    .reloj .eje { fill: #E0DFDA; stroke: none; }
    .rueda { position: relative; height: 1.24em; overflow: hidden; flex: none; }
    .rueda span { position: absolute; left: 0; top: 0; line-height: 1.24; white-space: nowrap; will-change: transform; }
    .r-hora { color: #A9B1B8; }

    /* Titulares del viernes y del lunes (mismo hueco) */
    .titular { position: absolute; left: 160px; width: 700px; top: 50%; margin-top: -100px; }
    .titular .mascara { font: 300 92px/1.04 "Butler"; letter-spacing: -.012em; white-space: nowrap; }

    /* Interfaces en papel con sombras largas y suaves */
    .papel { background: #F5F4F0; color: #08263D; border-radius: 18px; box-shadow: 0 70px 120px -40px rgba(0, 0, 0, .62), 0 26px 50px -18px rgba(0, 0, 0, .42); }

    /* Tarjeta de formación */
    .tarjeta { position: absolute; left: 960px; top: 336px; width: 760px; padding: 42px 48px 40px; will-change: transform, opacity; }
    .tarjeta .rot { color: rgba(8, 38, 61, .58); }
    .t-cuerpo { display: flex; gap: 40px; align-items: flex-start; margin-top: 30px; }
    .tarea { flex: 1; font: 300 54px/1.08 "Butler"; letter-spacing: -.01em; text-wrap: balance; }
    .doc { position: relative; flex: none; width: 120px; height: 152px; border-radius: 6px; background: #E0DFDA; padding: 18px 16px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 10px 22px -12px rgba(8, 38, 61, .45); }
    .doc b { display: block; height: 9px; width: 64%; border-radius: 3px; background: #08263D; }
    .doc i { display: block; height: 6px; border-radius: 3px; background: rgba(8, 38, 61, .2); }
    .doc i:nth-of-type(2) { width: 82%; }
    .doc .barras { margin-top: auto; height: 42px; display: flex; align-items: flex-end; gap: 7px; }
    .doc .barras s { display: block; flex: 1; background: #174467; border-radius: 2px 2px 0 0; transform-origin: 50% 100%; }
    .t-pie { display: flex; align-items: center; gap: 18px; margin-top: 34px; padding-top: 30px; border-top: 1px solid rgba(8, 38, 61, .14); }
    .visto { width: 52px; height: 52px; flex: none; overflow: visible; }
    .visto circle { fill: none; stroke: #08263D; stroke-width: 2.4; }
    .visto path { fill: none; stroke: #08263D; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .hecho { font: 500 30px/1.2 "Sofia Sans Condensed"; }

    /* Bandeja de entrada */
    .bandeja { position: absolute; left: 160px; top: 424px; width: 700px; height: 232px; overflow: hidden; will-change: transform, opacity; }
    .b-cab { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-bottom: 1px solid rgba(8, 38, 61, .1); }
    .b-cab i { width: 12px; height: 12px; border-radius: 50%; background: rgba(8, 38, 61, .16); }
    .b-cab b { margin-left: 18px; height: 14px; width: 200px; border-radius: 7px; background: rgba(8, 38, 61, .08); }
    .b-lista { position: relative; will-change: transform; }
    .correo { position: relative; display: flex; align-items: center; gap: 22px; padding: 0 30px; border-bottom: 1px solid rgba(8, 38, 61, .08); }
    .correo.nuevo { height: 120px; }
    .correo .tinte { position: absolute; inset: 0; background: #174467; }
    .correo .punto { position: relative; width: 14px; height: 14px; border-radius: 50%; background: #08263D; flex: none; }
    .correo .txt { position: relative; flex: 1; min-width: 0; }
    .de { font: 400 34px/1.1 "Butler"; }
    .asunto { font: 500 30px/1.25 "Sofia Sans Condensed"; margin-top: 6px; }
    .correo .hora { position: relative; align-self: flex-start; margin-top: 30px; color: rgba(8, 38, 61, .55); }
    .correo.viejo { height: 72px; gap: 18px; }
    .correo.viejo i { width: 14px; height: 14px; flex: none; }
    .correo.viejo b { display: block; height: 12px; border-radius: 6px; background: rgba(8, 38, 61, .1); }

    /* Panel de IA de la empresa */
    .panel { position: absolute; left: 960px; top: 262px; width: 800px; height: 524px; padding: 30px 36px 36px; will-change: transform, opacity, clip-path; }
    .p-cab { display: flex; align-items: center; gap: 16px; height: 44px; }
    .orbe { width: 44px; height: 44px; flex: none; overflow: visible; }
    .orbe .o1 { fill: #08263D; }
    .orbe .o2 { fill: none; stroke: #174467; stroke-width: 2.2; stroke-linecap: round; }
    .p-cab b { display: block; height: 12px; width: 150px; border-radius: 6px; background: rgba(8, 38, 61, .1); }
    .p-cab b + b { width: 90px; background: rgba(8, 38, 61, .06); }
    .encargo { position: relative; margin-top: 22px; height: 176px; border-radius: 14px; background: rgba(224, 223, 218, .7); padding: 22px 96px 22px 26px; font: 400 32px/1.3 "Sofia Sans Condensed"; }
    .encargo .w { display: none; }
    .encargo .w.on { display: inline; }
    .cursor { display: inline-block; width: 3px; height: 1.02em; margin-left: 4px; background: #08263D; vertical-align: -.16em; }
    .enviar { position: absolute; right: 20px; bottom: 20px; width: 54px; height: 54px; border-radius: 50%; background: #174467; }
    .enviar svg { position: absolute; inset: 0; width: 54px; height: 54px; }
    .enviar path { fill: none; stroke: #F5F4F0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .borrador { margin-top: 30px; display: grid; gap: 12px; }
    .borrador .mascara { font: 500 30px/1.3 "Sofia Sans Condensed"; }
    .borrador .sube { position: relative; padding-left: 28px; text-wrap: balance; }
    .borrador .sube::before { content: ""; position: absolute; left: 0; top: .5em; width: 10px; height: 10px; background: #174467; }
    .borrador b { font-weight: 700; }
    .sello { position: absolute; right: -30px; bottom: -46px; padding: 16px 24px 14px; border: 3px solid #08263D; border-radius: 6px; background: #F5F4F0; color: #08263D; font: 700 26px/1.3 "Sofia Sans Condensed"; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; box-shadow: inset 0 0 0 5px #F5F4F0, inset 0 0 0 6.5px rgba(8, 38, 61, .55), 0 26px 44px -14px rgba(0, 0, 0, .5); will-change: transform, opacity; }

    /* Escalera */
    .base { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .base .suelo { stroke: rgba(224, 223, 218, .3); stroke-width: 1.5; fill: none; }
    .base .llave { stroke: #A9B1B8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .base .pulso { stroke: #E0DFDA; stroke-width: 2; fill: none; stroke-linecap: round; opacity: .8; }
    .base .nodo { fill: #051A2B; stroke: #E0DFDA; stroke-width: 2; }
    .peldano { position: absolute; will-change: clip-path; box-shadow: -18px -10px 70px -10px rgba(0, 0, 0, .55); }
    .v .peldano { box-shadow: 0 44px 80px -34px rgba(0, 0, 0, .7); }
    .cara { position: absolute; inset: 0; padding: 26px 28px 26px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto 1fr; grid-template-areas: "n q" "v v" "f f" "e e"; background: linear-gradient(180deg, #0D3150, #0A2C47); box-shadow: inset 0 0 0 1px rgba(224, 223, 218, .13), inset 0 1px 0 rgba(255, 255, 255, .12); color: #E0DFDA; }
    .cara.luz { background: #FFFFFF; color: #08263D; box-shadow: 0 0 90px rgba(255, 255, 255, .22); }
    .cara .n { grid-area: n; color: #A9B1B8; }
    .cara .q { grid-area: q; justify-self: end; color: #A9B1B8; }
    .cara .verbo { grid-area: v; margin-top: 24px; font: 300 62px/1 "Butler"; letter-spacing: -.012em; }
    .cara .frase { grid-area: f; margin-top: 16px; font: 400 28px/1.25 "Sofia Sans Condensed"; text-wrap: balance; }
    .cara .ej { grid-area: e; align-self: end; display: flex; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(224, 223, 218, .16); font: 400 26px/1.25 "Sofia Sans Condensed"; color: #A9B1B8; }
    .ej span { text-wrap: balance; }
    .ej .hoja { position: relative; flex: none; width: 18px; height: 23px; margin-top: 4px; border: 1.6px solid currentColor; border-radius: 2px; }
    .ej .hoja::before, .ej .hoja::after { content: ""; position: absolute; left: 3px; right: 3px; height: 1.6px; background: currentColor; top: 6px; }
    .ej .hoja::after { top: 11px; right: 6px; }
    .cara.luz .n, .cara.luz .q, .cara.luz .ej { color: #174467; }
    .cara.luz .ej { border-top-color: rgba(8, 38, 61, .16); }
    .marcador { position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: #FFFFFF; box-shadow: 0 0 0 2px #051A2B, 0 0 34px 4px rgba(255, 255, 255, .45); transform-origin: 50% 50%; will-change: transform; }
    .destello { position: absolute; left: 0; top: 0; height: 2px; background: #FFFFFF; box-shadow: 0 0 18px 2px rgba(255, 255, 255, .6); transform-origin: 100% 50%; will-change: transform, opacity; }
    .m-etq { position: absolute; top: 0; white-space: nowrap; color: #FFFFFF; will-change: transform, opacity; }
    .tramo { position: absolute; display: flex; align-items: baseline; gap: 14px; white-space: nowrap; will-change: transform, opacity; }
    .tramo .p { font: 400 38px/1 "Butler"; color: #E0DFDA; }
    .tramo .d { font: 400 28px/1.15 "Sofia Sans Condensed"; color: #A9B1B8; }
    .tramo .sep { width: 6px; height: 6px; border-radius: 50%; background: #A9B1B8; align-self: center; flex: none; }
    .latido { position: absolute; left: 0; top: 0; width: 220px; height: 26px; margin: -13px 0 0 -110px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .95), rgba(255, 255, 255, .35) 40%, rgba(255, 255, 255, 0)); will-change: transform, opacity; }

    /* Cabecera de la escalera: título pequeño y, al final, el remate */
    .cabecera { position: absolute; left: 160px; top: 80px; }
    .esc-t .mascara { font: 300 56px/1.06 "Butler"; letter-spacing: -.01em; white-space: nowrap; }
    .remate { position: absolute; left: 0; top: 0; }
    .remate .mascara { font: 300 66px/1.06 "Butler"; letter-spacing: -.012em; white-space: nowrap; }
    .remate .blanco { color: #FFFFFF; }

    .ilus { position: absolute; right: 160px; top: 100px; color: #A9B1B8; }

    /* 4:5 (1080×1350, móvil): render_piezas.sh pone class="v" en <html>. Mismo guion y textos; la escalera sube en diagonal */
    html.v .lienzo { width: 1080px; height: 1350px; }
    .v .rot { font-size: 30px; }
    .v .dia { left: 84px; top: 74px; font-size: 64px; gap: 22px; }
    .v .titular { left: 84px; top: 190px; margin-top: 0; width: 912px; }
    .v .titular .mascara { font-size: 80px; }
    .v .tarjeta { left: 84px; top: 520px; width: 912px; padding: 44px 48px 42px; }
    .v .tarea { font-size: 58px; }
    .v .doc { width: 132px; height: 166px; }
    .v .hecho { font-size: 32px; }
    .v .bandeja { left: 84px; top: 420px; width: 912px; height: 212px; }
    .v .de { font-size: 36px; }
    .v .asunto { font-size: 32px; }
    .v .panel { left: 84px; top: 652px; width: 912px; height: 476px; }
    .v .encargo { height: 140px; font-size: 32px; }
    .v .borrador .mascara { font-size: 32px; }
    .v .sello { font-size: 30px; right: 2px; bottom: -58px; }
    .v .sello div { display: inline; }
    .v .sello div + div { margin-left: .4em; }
    .v .cara { padding: 24px 28px 22px; grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr; grid-template-areas: "n v q" "e e e"; column-gap: 18px; align-items: baseline; }
    .v .cara .verbo { margin-top: 0; font-size: 50px; }
    .v .cara .frase { display: none; }
    .v .cara .ej { font-size: 30px; padding-top: 12px; }
    .v .marcador { width: 34px; height: 34px; }
    .v .tramo { flex-direction: column; align-items: flex-start; gap: 8px; white-space: normal; width: 220px; }
    .v .tramo.dcha { align-items: flex-end; text-align: right; }
    .v .tramo .sep { display: none; }
    .v .tramo .d { font-size: 30px; }
    .v .tramo.pul { flex-direction: row; align-items: baseline; gap: 14px; width: auto; white-space: nowrap; }
    .v .tramo.pul .sep { display: block; }
    .v .cabecera { left: 84px; top: 80px; }
    .v .esc-t .mascara { font-size: 54px; }
    .v .remate .mascara { font-size: 58px; }
    .v .ilus { right: auto; left: 84px; top: auto; bottom: 84px; font-size: 30px; }
  </style>
  <script src="gsap.min.js"></script>
  <script src="copy.js"></script>
</head>
<body>
  <!-- 24 s a 30 fps (720 fotogramas), 16:9 y 4:5, sin sonido. Línea de tiempo en lunes.js; textos en copy.js -->
  <div id="pieza" class="lienzo" data-composition-id="lunes" data-start="0" data-duration="24" data-width="1920" data-height="1080" data-fps="30"></div>
  <script src="lunes.js"></script>
  <script>
    PIEZA.montar(document.getElementById('pieza'));
    const tl = gsap.timeline({ paused: true, onUpdate: () => PIEZA.pintar(tl.time()) });
    tl.to({ ancla: 0 }, { ancla: 1, duration: PIEZA.duracion, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["lunes"] = tl;
    tl.seek(0);
    PIEZA.pintar(0);
  </script>
</body>
</html>
