<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1350" />
  <title>Película de apertura · Spiralia AI</title>
  <style>
    @font-face { font-family: "Butler"; src: url("Butler-Light.otf") format("opentype"); font-weight: 300; font-display: block; }
    @font-face { font-family: "Butler"; src: url("Butler-Regular.otf") format("opentype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Sofia Sans Condensed"; src: url("SofiaSansCondensed-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: #051A2B; }
    .lienzo { position: relative; width: 1080px; height: 1350px; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    .fondo, .escena { position: absolute; inset: 0; }
    .cromo { position: absolute; left: 84px; top: 76px; font: 600 24px/1 "Sofia Sans Condensed"; letter-spacing: .26em; text-transform: uppercase; }
    .bloque { position: absolute; left: 84px; right: 84px; }
    .centro { top: 50%; transform: translateY(-50%); }
    .mascara { overflow: hidden; padding-bottom: .08em; }
    .sube { display: block; will-change: transform; }
    .grande .mascara { font: 300 118px/1.02 "Butler"; letter-spacing: -.012em; }
    .enorme .mascara { font: 300 176px/1 "Butler"; letter-spacing: -.015em; }
    .grande .mascara.mayor { font-size: 168px; }
    .grande .mascara.blanco { color: #FFFFFF; }
    .relevo { position: relative; height: 1.12em; padding-bottom: 0; font: 300 118px/1.02 "Butler"; letter-spacing: -.012em; color: #FFFFFF; }
    .relevo .sube { position: absolute; left: 0; top: 0; white-space: nowrap; }
    .s4 .relevo { color: inherit; }
    .cifra { position: absolute; left: 70px; top: 150px; font: 300 400px/1 "Butler"; letter-spacing: -.03em; }
    .cifra .suf { font-size: .42em; margin-left: .06em; }
    .etiqueta { position: absolute; left: 84px; top: 610px; width: 860px; font: 400 54px/1.2 "Sofia Sans Condensed"; letter-spacing: .01em; }
    .reja { position: absolute; left: 84px; right: 84px; top: 820px; }
    .reja-t { font: 600 22px/1 "Sofia Sans Condensed"; letter-spacing: .22em; text-transform: uppercase; opacity: .7; margin-bottom: 22px; }
    .reja-g { display: grid; grid-template-columns: repeat(20, 1fr); gap: 18px 0; justify-items: center; }
    .reja-g i { display: block; width: 24px; height: 24px; border-radius: 50%; background: rgba(224, 223, 218, .16); transition: none; }
    .reja-g i.on { background: #FFFFFF; box-shadow: 0 0 14px rgba(255, 255, 255, .55); }
    .cuadros .reja-g i { border-radius: 5px; background: rgba(8, 38, 61, .13); }
    .cuadros .reja-g i.on { background: #08263D; box-shadow: 0 0 0 5px rgba(8, 38, 61, .14); }
    .fuente { position: absolute; left: 84px; bottom: 84px; width: 900px; font: 400 23px/1.35 "Sofia Sans Condensed"; letter-spacing: .02em; opacity: .7; }
    .ese { position: absolute; left: 50%; top: 240px; height: 560px; transform: translateX(-50%); overflow: visible; }
    .ese path { fill: none; stroke: #E0DFDA; stroke-width: 3; stroke-linecap: round; }
    .marca { position: absolute; left: 50%; margin-left: -210px; top: 880px; width: 420px; }
    .lema { position: absolute; left: 0; right: 0; top: 1012px; text-align: center; font: 500 32px/1 "Sofia Sans Condensed"; letter-spacing: .24em; text-transform: uppercase; color: #A9B1B8; }
    /* Versión horizontal (1920×1080, escritorio): render_film.sh pone class="h" en <html>. Mismo guion y textos */
    html.h, html.h body, html.h .lienzo { width: 1920px; height: 1080px; }
    .h .cromo { left: 160px; top: 84px; font-size: 26px; }
    .h .bloque { left: 160px; right: 160px; }
    .h .grande .mascara, .h .relevo { font-size: 148px; }
    .h .enorme .mascara { font-size: 210px; }
    .h .grande .mascara.mayor { font-size: 210px; }
    .h .cifra { left: 140px; top: 50%; transform: translateY(-56%); font-size: 470px; }
    .h .etiqueta { left: 1080px; top: 250px; width: 700px; font-size: 54px; }
    .h .reja { left: 1080px; right: auto; width: 700px; top: 560px; }
    .h .reja-g { gap: 16px 0; }
    .h .reja-g i { width: 20px; height: 20px; }
    .h .fuente { left: 160px; bottom: 84px; width: 1600px; font-size: 24px; }
    .h .ese { top: 150px; height: 520px; }
    .h .marca { top: 720px; }
    .h .lema { top: 846px; font-size: 30px; }
  </style>
  <script src="gsap.min.js"></script>
  <script src="s-geom.js"></script>
  <script src="copy.js"></script>
</head>
<body>
  <!-- 22 s a 30 fps (660 fotogramas), 4:5, sin sonido. Guion en film.js; textos en copy.js -->
  <div id="film" class="lienzo" data-composition-id="film" data-start="0" data-duration="22" data-width="1080" data-height="1350" data-fps="30"></div>
  <script src="film.js"></script>
  <script>
    FILM.montar(document.getElementById('film'));
    const tl = gsap.timeline({ paused: true, onUpdate: () => FILM.pintar(tl.time()) });
    tl.to({ ancla: 0 }, { ancla: 1, duration: FILM.duracion, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["film"] = tl;
    tl.seek(0);
    FILM.pintar(0);
  </script>
</body>
</html>
