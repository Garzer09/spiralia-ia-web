<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Fondo de la portada · Spiralia AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #051A2B; }
    .lienzo { position: relative; overflow: hidden; background: #051A2B; }
    .noche, .vineta, .sombra-izq, .sombra-abajo { position: absolute; inset: 0; }
    .noche { background: radial-gradient(110% 85% at 70% 46%, #072339 0%, #041625 58%, #020B14 100%); }
    .aura { position: absolute; left: 0; top: 0; border-radius: 50%; will-change: transform; }
    .capa { position: absolute; will-change: transform; }
    .capa svg { display: block; overflow: visible; }
    .camara { transform-origin: 50% 50%; }
    .cerca { filter: blur(9px); }
    .mota { position: absolute; left: 0; top: 0; border-radius: 50%; background: #E0DFDA; box-shadow: 0 0 6px rgba(224, 223, 218, .6); }
    .vineta { background: radial-gradient(125% 100% at 64% 48%, transparent 50%, rgba(2, 10, 18, .78) 100%); }
    .sombra-izq { background: linear-gradient(90deg, rgba(5, 26, 43, .78) 0%, rgba(5, 26, 43, .45) 34%, transparent 58%); }
    .sombra-abajo { background: linear-gradient(0deg, rgba(5, 26, 43, .9) 0%, rgba(5, 26, 43, .55) 38%, transparent 62%); }
  </style>
  <script src="gsap.min.js"></script>
  <script src="s-geom.js"></script>
</head>
<body>
  <!-- Bucle de 12 s a 24 fps, sin sonido. Coreografía en bg.js (función de t). render_hero_bg.sh cambia el tamaño para la versión vertical -->
  <div id="fondo" class="lienzo" data-composition-id="fondo" data-start="0" data-duration="12" data-width="1920" data-height="1080" data-fps="24"></div>
  <script src="bg.js"></script>
  <script>
    FONDO.montar(document.getElementById('fondo'));
    const tl = gsap.timeline({ paused: true, onUpdate: () => FONDO.pintar(tl.time()) });
    tl.to({ ancla: 0 }, { ancla: 1, duration: FONDO.duracion, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["fondo"] = tl;
    tl.seek(0);
    FONDO.pintar(0);
  </script>
</body>
</html>
