lead = {es = "Somos un equipo de consultores de estrategia, ingenieros y profesores universitarios. Hemos estado al otro lado de la mesa: por eso empezamos por tu cuenta de resultados, no por la tecnología.", en = "We're a team of strategy consultants, engineers and university lecturers. We've been on the other side of the table: that's why we start with your P&amp;L, not with the technology."}
i1h = {es = "Venimos de la consultoría estratégica.", en = "We come from strategy consulting."}
i1 = {es = "Hablamos de margen, prioridades y riesgo. La tecnología viene después.", en = "We talk about margin, priorities and risk. The technology comes after."}
i2h = {es = "Sabemos explicar la IA sin humo.", en = "We explain AI without the hype."}
i2 = {es = "Damos clase en un grado universitario de Inteligencia Artificial, con el rigor de quien tiene que evaluar a sus alumnos.", en = "We teach on a university degree in Artificial Intelligence, with the rigor of someone who has to grade their students."}
i4h = {es = "Cada perfil, con sus casos.", en = "Every profile, with its own cases."}
i4 = {es = "Antes de enseñar, entendemos cómo trabaja cada equipo. Nada de ejemplos de manual.", en = "Before teaching, we understand how each team works. No textbook examples."}
i5h = {es = "Construimos hasta que funciona.", en = "We build until it works."}
i5 = {es = "Después, tu equipo sigue solo: le dejamos el método, el gobierno y la capacidad de construir.", en = "Then your team carries on alone: we leave it the method, the governance and the ability to build."}
eq_h = {es = "Quién trabaja contigo", en = "Who works with you"}
