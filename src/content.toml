# Copy de la página · ES y EN en cada clave.
# Se permite HTML sencillo (<em>, <b>, <br>, <a>, <span>). Las cifras tienen que estar en cifras.toml.
# Si falta "en", el build usa el texto en español y avisa (en --prod falla).
# {mail} se sustituye por el email de contacto (MAIL en build.py).
#
# Guía de estilo (resumen; completa en investigacion/04_auditoria_2026-10.md):
#  · «Tú» al lector, siempre en singular. Spiralia habla en plural y como equipo: sin nombres propios de personas.
#  · Titulares de 12 palabras o menos, en dos tiempos. Subtítulos de 20 o menos. Una idea por bloque.
#  · Primero el resultado, después el método. Pérdida en el problema; ganancia en la solución.
#  · Palabras de negocio. Un término técnico solo si hace falta, explicado en una línea la primera vez.
#  · Hechos en lugar de adjetivos. Sin exclamaciones, sin superlativos, sin escasez inventada.

