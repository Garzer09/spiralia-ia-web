i2 = {es = "Uno de nosotros da clase en un grado universitario de Inteligencia Artificial. Explicamos con el rigor de quien tiene que evaluar a sus alumnos.", en = "One of us teaches in a university AI degree program. We explain with the rigor of someone who has to grade their students."}
