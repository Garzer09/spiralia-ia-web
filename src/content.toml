o = {es = ["Todavía no", "Un curso general para todos", "Por perfiles, con algún caso propio", "Por perfil, con sus tareas y archivos, y con seguimiento"], en = ["Not yet", "A general course for everyone", "By profile, with some cases of our own", "By profile, with their own tasks and files, and with follow-up"]}

[[data.diag.q]]
