t1_2 = {es = "Elegimos los casos por valor, en eficiencia y en crecimiento. La eficiencia tiene techo; el crecimiento, no.", en = "We choose cases by value, in efficiency and in growth. Efficiency has a ceiling; growth doesn't."}
t1_3 = {es = "Construimos los primeros con tus equipos y los medimos frente al punto de partida.", en = "We build the first ones with your teams and measure them against the starting point."}
t1_4 = {es = "Diseñamos contigo el gobierno: quién propone, quién decide y quién responde.", en = "We design governance with you: who proposes, who decides and who answers for it."}
t1_l = {es = "Una lista corta de casos con valor, los primeros funcionando y un equipo que sabe seguir.", en = "A short list of valuable cases, the first ones running and a team that knows how to continue."}
t1_p = {es = "En ING España, del comité de dirección a las oficinas, los usuarios activos cada semana pasaron del 66 % al 92 %.", en = "At ING Spain, from the leadership team to the branches, weekly active users went from 66% to 92%."}
t1_cta = {es = "Reserva Rumbo", en = "Book Rumbo"}
t2_tab = {es = "Diriges Personas", en = "You lead People"}
t2_h = {es = "Te piden productividad. Tu gente te pide rumbo.", en = "They ask you for productivity. Your people ask you for direction."}
t2_voz = {es = "«¿Cómo lo hago sin que la plantilla lo viva como una amenaza?»", en = "“How do I do this without the workforce seeing it as a threat?”"}
t2_1 = {es = "Formamos a todos, del comité a la primera línea, cada perfil con su trabajo.", en = "We train everyone, from the leadership team to the front line, each profile with their own work."}
t2_2 = {es = "Damos al programa nombre, marca y una credencial que cada persona enseña en LinkedIn.", en = "We give the program a name, a brand and a credential everyone can show on LinkedIn."}
t2_3 = {es = "Dejamos claro quién responde de cada agente y qué decide siempre una persona.", en = "We make clear who answers for each agent and what a person always decides."}
t2_4 = {es = "Te ayudamos a contarlo a la plantilla y a sus representantes, con transparencia.", en = "We help you explain it to the workforce and its representatives, transparently."}
t2_5 = {es = "Creamos champions y una comunidad para que el hábito no dependa de nosotros.", en = "We build champions and a community so the habit doesn't depend on us."}
t2_l = {es = "Una plantilla que usa la IA con criterio y sin miedo, y un modelo que se sostiene solo.", en = "A workforce that uses AI with judgment and without fear, and a model that sustains itself."}
t2_p = {es = "En ING España, la satisfacción con el uso de la IA llegó a 4,7 sobre 5, frente a 3,2 del segundo país del grupo.", en = "At ING Spain, satisfaction with AI use reached 4.7 out of 5, versus 3.2 in the group's second country."}
t2_cta = {es = "Haz el diagnóstico en 3 minutos", en = "Take the 3-minute assessment"}
t3_tab = {es = "Diriges Formación", en = "You lead Learning"}
t3_h = {es = "Llenar el aula es fácil. Cambiar cómo se trabaja, no tanto.", en = "Filling the classroom is easy. Changing how people work, not so much."}
t3_voz = {es = "«La encuesta de satisfacción salió bien. ¿Y el uso?»", en = "“The satisfaction survey came out well. And usage?”"}
t3_1 = {es = "Diseñamos un programa por perfil, con sus casos y sus archivos, no un catálogo para todos.", en = "We design a program per profile, with their cases and their files, not a one-size-fits-all catalog."}
t3_2 = {es = "Llegamos a escala: presencial, en directo y a su ritmo.", en = "We work at scale: in person, live online and self-paced."}
t3_3 = {es = "Medimos el uso real y lo que se construye, no solo las horas y la satisfacción.", en = "We measure real usage and what gets built, not just hours and satisfaction."}
t3_4 = {es = "Dejamos documentado lo que se ha hecho, que es lo que pide el Reglamento europeo de IA.", en = "We document what has been done, which is what the EU AI Act asks for."}
t3_5 = {es = "Champions y comunidad, para que la formación siga viva cuando nos vamos.", en = "Champions and community, so the training stays alive after we leave."}
t3_l = {es = "Un programa que se nota en el trabajo y datos para defenderlo ante la dirección.", en = "A program that shows in the work, and data to defend it to leadership."}
t3_p = {es = "En Deloitte formamos a 13.000 personas en un mes, y a 3.000 managers y directores.", en = "At Deloitte we trained 13,000 people in one month, and 3,000 managers and directors."}
t3_cta = {es = "Pide un ejemplo de programa", en = "Ask for a sample program"}
t3_subject = {es = "Ejemplo de programa para mi equipo", en = "Sample program for my team"}

