s = {es = ["Repite el método proceso a proceso, en ciclos cortos.", "Forma a tus propios constructores para no depender de nadie."], en = ["Repeat the method process by process, in short cycles.", "Train your own builders so you don't depend on anyone."]}

[[data.diag.n]]
