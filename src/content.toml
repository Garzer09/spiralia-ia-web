[faq]
kicker = {es = "Preguntas del comité", en = "Leadership team questions"}
h2 = {es = "Lo que nos preguntan antes de empezar.", en = "What we're asked before getting started."}
q1 = {es = "¿Por qué ahora y no dentro de seis meses?", en = "Why now and not in six months?"}
a1 = {es = "Porque el uso se enfría en semanas y las licencias se pagan igual. Y porque quien ya rediseña su trabajo no va un paso por delante: va una curva por delante.", en = "Because usage cools off within weeks and the licenses cost the same. And because those already redesigning their work aren't one step ahead: they're a whole curve ahead."}
q2 = {es = "¿Nuestros datos salen de la empresa?", en = "Does our data leave the company?"}
a2 = {es = "Solo por donde ya lo permite tu IT. Trabajamos dentro de tu entorno, con las herramientas y los permisos que aprueba tu IT. Los casos de la formación se preparan con tus documentos, bajo confidencialidad, y lo que construimos vive en tus sistemas.", en = "Only where your IT already allows it. We work inside your environment, with the tools and permissions your IT approves. Training cases are prepared with your documents, under confidentiality, and what we build lives in your systems."}
q3 = {es = "¿Sois lo bastante grandes para nosotros?", en = "Are you big enough for us?"}
a3 = {es = "En Deloitte España formamos a 13.000 personas en un mes. Somos una boutique por cómo trabajamos, no por lo que abarcamos.", en = "At Deloitte Spain we trained 13,000 people in one month. We're a boutique in how we work, not in what we can take on."}
q4 = {es = "¿Y si no funciona?", en = "What if it doesn't work?"}
a4 = {es = "Empezamos por algo pequeño y medible: Rumbo, 3 horas con tu comité. Y cada solución se prueba con casos reales antes de usarse de verdad.", en = "We start small and measurable: Rumbo, 3 hours with your leadership team. And every solution is tested on real cases before it's used for real."}
q5 = {es = "¿Con qué IA trabajáis? Ya tenemos un partner de Microsoft.", en = "Which AI do you work with? We already have a Microsoft partner."}
a5 = {es = "Con la que ya tiene tu empresa: Microsoft 365 Copilot, ChatGPT, Claude o Gemini. Tu partner pone la herramienta; nosotros, que se use en cada puesto. Si aún no está elegida, te ayudamos a decidir.", en = "With the one your company already has: Microsoft 365 Copilot, ChatGPT, Claude or Gemini. Your partner brings the tool; we make it work in every role. If it hasn't been chosen yet, we help you decide."}
q6 = {es = "¿Nos quedamos con lo que se construye?", en = "Do we keep what gets built?"}
a6 = {es = "Vive en tus sistemas desde el primer día. Al terminar te dejamos el manual, las pruebas y la formación para que tu equipo lo mantenga.", en = "It lives in your systems from day one. When we finish, we leave you the manual, the tests and the training so your team can maintain it."}
q7 = {es = "¿Cuánto tiempo pide a nuestros equipos?", en = "How much time does it take from our teams?"}
a7 = {es = "Rumbo son 3 horas de tu comité. En los programas, las sesiones se hacen en jornada y el contenido a su ritmo cabe entre tarea y tarea. En un despliegue, el experto del área prueba y corrige cada versión; el ingeniero hace el resto.", en = "Rumbo takes 3 hours of your leadership team's time. In programs, sessions take place during working hours and self-paced content fits between tasks. In a deployment, the area's expert tests and corrects each version; the engineer does the rest."}
q8 = {es = "Ya hemos hecho formación. ¿Empezamos de cero?", en = "We've already done training. Do we start from scratch?"}
a8 = {es = "Al contrario: partimos de ahí. Solo el 36 % de los profesionales cree que su formación en IA ha sido suficiente (BCG, 2026). Vemos qué se usa y qué no, y llevamos a cada perfil al siguiente nivel con sus propios casos.", en = "Quite the opposite: we build on it. Only 36% of professionals think their AI training has been enough (BCG, 2026). We see what is being used and what isn't, and take each profile to the next level with their own cases."}
q9 = {es = "¿Qué pide el Reglamento europeo de IA?", en = "What does the EU AI Act require?"}
a9 = {es = "Desde 2025, las empresas que usan IA deben adoptar medidas para que su plantilla tenga los conocimientos necesarios. Tras la reforma de 2026 no hace falta certificar a cada persona, pero sí poder enseñar lo que se ha hecho. Nuestros programas lo dejan documentado.", en = "Since 2025, companies that use AI must take measures so their staff have the necessary knowledge. Since the 2026 reform, certifying each person is not required, but you must be able to show what has been done. Our programs document it."}
q10 = {es = "¿Cuánto cuesta?", en = "How much does it cost?"}
a10 = {es = "Depende de tu punto de partida y de hasta dónde quieras llegar: cada programa se diseña a medida. Lo vemos en una conversación de 30 minutos y te llevas una propuesta de primer paso.", en = "It depends on your starting point and how far you want to go: every program is designed to measure. We'll go through it in a 30-minute conversation and you'll leave with a proposed first step."}

