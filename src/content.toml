t1_4 = {es = "Diseñamos contigo el gobierno: quién propone, quién decide y quién responde.", en = "We design governance with you: who proposes, who decides and who answers for it."}
t1_l = {es = "Una lista corta de casos con valor, los primeros funcionando y un equipo que sabe seguir.", en = "A short list of valuable cases, the first ones running and a team that knows how to continue."}
t1_p = {es = "En ING España, del comité de dirección a las oficinas, los usuarios activos cada semana pasaron del 66 % al 92 %.", en = "At ING Spain, from the leadership team to the branches, weekly active users went from 66% to 92%."}
t1_cta = {es = "Pide fecha para tu Día Uno", en = "Request a date for your Day One"}
t2_tab = {es = "Personas y talento", en = "People and talent"}
t2_h = {es = "Te piden productividad. Tu gente te pide dirección.", en = "They ask you for productivity. Your people ask you for direction."}
t2_voz = {es = "«¿Cómo lo hago sin que la plantilla lo viva como una amenaza? Y la encuesta salió bien, pero ¿y el uso?»", en = "“How do I do this without the workforce seeing it as a threat? And the survey came out well, but what about usage?”"}
t2_0 = {es = "Empezamos con Día Uno: tu gente trabaja con la IA en lo suyo, en horario laboral y sin examen.", en = "We start with Day One: your people work with AI on their own tasks, during working hours, with no grading."}
t2_1 = {es = "Formamos a todos, del comité a la primera línea, cada perfil con sus tareas y sus archivos.", en = "We train everyone, from the leadership team to the front line, each profile with their own tasks and files."}
t2_2 = {es = "Damos al programa nombre y marca propios, para que la plantilla lo reconozca como suyo.", en = "We give the program its own name and brand, so your people recognize it as theirs."}
t2_3 = {es = "Medimos el uso real y lo que se construye, no solo las horas y la satisfacción.", en = "We measure real usage and what gets built, not just hours and satisfaction."}
t2_4 = {es = "Te ayudamos a contarlo a la plantilla y a sus representantes, con transparencia.", en = "We help you explain it to the workforce and its representatives, transparently."}
t2_5 = {es = "Creamos champions y una comunidad para que el hábito no dependa de nosotros.", en = "We build champions and a community so the habit doesn’t depend on us."}
t2_6 = {es = "Dejamos documentado lo que se ha hecho. Con el Reglamento europeo de IA, conviene poder enseñarlo.", en = "We document what has been done. Under the EU AI Act, you should be able to show it."}
t2_l = {es = "Una plantilla que usa la IA con criterio y sin miedo, datos para defender el programa ante la dirección y un modelo que se sostiene solo.", en = "A workforce that uses AI with judgment and without fear, data to defend the program to leadership and a model that sustains itself."}
t2_p = {es = "En ING España, con el programa, la satisfacción con el uso de la IA llegó a 4,7 sobre 5. En el siguiente país del grupo, 3,2.", en = "At ING Spain, with the program, satisfaction with AI use reached 4.7 out of 5. In the next-best country in the group, 3.2."}
t2_cta = {es = "Hablemos de tu plantilla", en = "Let’s talk about your workforce"}
t2_subject = {es = "Formación en IA para mi plantilla", en = "AI training for my workforce"}
t3_tab = {es = "Tecnología", en = "Technology"}
t3_h = {es = "La IA, dentro de tu casa. Con tus reglas.", en = "AI inside your walls. On your terms."}
t3_voz = {es = "«No quiero otra herramienta en la sombra ni otro piloto que nunca llega a producción.»", en = "“I don’t want another shadow tool, or another pilot that never reaches production.”"}
t3_1 = {es = "Trabajamos dentro de tu entorno y con la IA que aprueba tu IT: Microsoft 365 Copilot, ChatGPT, Claude o Gemini.", en = "We work inside your environment and with the AI your IT approves: Microsoft 365 Copilot, ChatGPT, Claude or Gemini."}
t3_2 = {es = "Cada agente tiene un dueño, unos permisos y un registro de lo que hace.", en = "Every agent has an owner, permissions and a log of what it does."}
t3_3 = {es = "Antes de usarse, se prueba con casos reales, también los raros. La autonomía se gana con pruebas.", en = "Before it’s used, it’s tested on real cases, edge cases included. Autonomy is earned with evidence."}
t3_4 = {es = "Lo traspasamos con manual, pruebas y formación, para que tu equipo lo mantenga sin depender de nosotros.", en = "We hand it over with a manual, tests and training, so your team maintains it without depending on us."}
t3_l = {es = "Agentes en uso, gobernados y documentados, y un equipo interno capaz de mantenerlos.", en = "Agents in use, governed and documented, and an in-house team able to maintain them."}
t3_prueba = {es = "Sin cambiar de herramienta", en = "Without changing tools"}
t3_p = {es = "En Deloitte España formamos a 13.000 personas en un mes con la IA que ya tenían: Microsoft 365 Copilot.", en = "At Deloitte Spain we trained 13,000 people in one month with the AI they already had: Microsoft 365 Copilot."}
t3_cta = {es = "Hablemos de tu entorno", en = "Let’s talk about your environment"}

