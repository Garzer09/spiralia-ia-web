[faq]
kicker = {es = "Preguntas del comité", en = "Leadership team questions"}
h2 = {es = "Lo que nos preguntan antes de empezar.", en = "What we’re asked before getting started."}
q1 = {es = "¿Por qué ahora y no dentro de seis meses?", en = "Why now and not in six months?"}
a1 = {es = "Porque el uso se enfría en semanas y las licencias se pagan igual. Y porque la IA multiplica: quien ya rediseña su trabajo no va un paso por delante, va una curva por delante, y la distancia crece cada semana.", en = "Because usage cools off within weeks and the licenses cost the same. And because AI multiplies: those already redesigning their work aren’t one step ahead, they’re a whole curve ahead, and the gap grows every week."}
q2 = {es = "¿Tengo que empezar por Rumbo?", en = "Do I have to start with Rumbo?"}
a2 = {es = "No. Es la forma más rápida de ordenar las prioridades, pero cada producto funciona solo: si tu gente ya está formada, Spiral empieza en la P; si ya tienes casos priorizados, puedes empezar por la Formación a medida. Alfabetización IA y Radar pueden empezar cuando quieras.", en = "No. It’s the fastest way to set priorities, but each product works on its own: if your people are already trained, Spiral starts at P; if you already have prioritized cases, you can start with Tailored Training. AI Literacy and Radar can start whenever you like."}
q3 = {es = "¿Nuestros datos salen de la empresa?", en = "Does our data leave the company?"}
a3 = {es = "Solo por donde ya lo permite tu IT. Trabajamos dentro de tu entorno, con las herramientas y los permisos que aprueba tu IT. Para preparar la formación usamos tus documentos, con acuerdo de confidencialidad y de encargo del tratamiento, o datos ficticios.", en = "Only where your IT already allows it. We work inside your environment, with the tools and permissions your IT approves. To prepare the training we use your documents, under a confidentiality and data processing agreement, or fictitious data."}
q4 = {es = "¿Sois lo bastante grandes para nosotros?", en = "Are you big enough for us?"}
a4 = {es = "En Deloitte España formamos a 13.000 personas en un mes. Somos una boutique por cómo trabajamos, no por lo que abarcamos.", en = "At Deloitte Spain we trained 13,000 people in one month. We’re a boutique in how we work, not in what we can take on."}
q5 = {es = "¿Y si no funciona?", en = "What if it doesn’t work?"}
a5 = {es = "Empezamos por algo pequeño que se ve el mismo día: Rumbo, un día de trabajo real con tu comité y tus managers. Si no vemos casos con valor, te lo decimos. Y en Spiral cada solución se prueba con casos reales antes de usarse de verdad.", en = "We start small, with something you can see the same day: Rumbo, a day of real work with your leadership team and managers. If we don’t see valuable cases, we’ll tell you. And in Spiral every solution is tested on real cases before it’s used for real."}
q6 = {es = "¿Con qué IA trabajáis? Ya tenemos un partner de Microsoft.", en = "Which AI do you work with? We already have a Microsoft partner."}
a6 = {es = "Con la que ya tiene tu empresa: Microsoft 365 Copilot, ChatGPT, Claude o Gemini. Tu partner pone la herramienta; nosotros, que se use en cada puesto. Si aún no está elegida, te ayudamos a decidir.", en = "With the one your company already has: Microsoft 365 Copilot, ChatGPT, Claude or Gemini. Your partner brings the tool; we make it work in every role. If it hasn’t been chosen yet, we help you decide."}
q7 = {es = "¿Nos quedamos con lo que se construye?", en = "Do we keep what gets built?"}
a7 = {es = "Sí. Lo que construimos para ti es tuyo y vive en tu entorno, con las herramientas que aprueba tu IT, no en una plataforma nuestra. Al terminar te dejamos el manual, las pruebas y la formación para que tu equipo lo mantenga.", en = "Yes. What we build for you is yours and lives in your environment, with the tools your IT approves, not on a platform of ours. When we finish, we leave you the manual, the tests and the training so your team can maintain it."}
q8 = {es = "¿Cuánto tiempo pide a nuestros equipos?", en = "How much time does it take from our teams?"}
a8 = {es = "Rumbo pide un día a tu comité y a tus managers, en horario de trabajo y sin examen. En la Formación a medida, las sesiones en directo van dentro del horario y lo grabado cabe entre tarea y tarea. En Spiral, el experto del área prueba y corrige cada versión; el ingeniero hace el resto. Alfabetización IA es un curso grabado que cada persona hace a su ritmo, y Radar, una sesión al mes.", en = "Rumbo takes one day from your leadership team and managers, during working hours and with no grading. In Tailored Training, live sessions run during working hours and recorded content fits between tasks. In Spiral, the area’s expert tests and corrects each version; the engineer does the rest. AI Literacy is a recorded course everyone takes at their own pace, and Radar, one session a month."}
q9 = {es = "Ya hemos hecho formación. ¿Empezamos de cero?", en = "We’ve already done training. Do we start from scratch?"}
a9 = {es = "Al contrario: partimos de ahí. Es el primer paso de la Formación a medida. Vemos qué se usa y qué no, y llevamos a cada perfil al siguiente peldaño con sus propios casos.", en = "Quite the opposite: we build on it. It’s the first step of Tailored Training. We see what is being used and what isn’t, and take each profile to the next step with their own cases."}
q10 = {es = "¿Qué pide el Reglamento europeo de IA?", en = "What does the EU AI Act require?"}
