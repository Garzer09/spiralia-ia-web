[faq]
kicker = {es = "Preguntas del comité", en = "Leadership team questions"}
h2 = {es = "Lo que nos preguntan antes de empezar.", en = "What we're asked before getting started."}
q1 = {es = "¿Nuestros datos salen de la empresa?", en = "Does our data leave the company?"}
a1 = {es = "No hace falta. Trabajamos dentro de tu entorno y con las herramientas que aprueba tu IT. Los casos de la formación se preparan con tus documentos, bajo confidencialidad, y lo que construimos vive en tus sistemas.", en = "It doesn't need to. We work inside your environment and with the tools your IT approves. Training cases are prepared with your documents, under confidentiality, and what we build lives in your systems."}
q2 = {es = "¿Cuánto tiempo pide a nuestros equipos?", en = "How much time does it take from our teams?"}
a2 = {es = "Rumbo son 3 horas de tu comité. En los programas, las sesiones se hacen en jornada y el contenido a su ritmo cabe entre tarea y tarea. En un despliegue, el experto del área prueba y corrige cada versión; el FDE hace el resto.", en = "Rumbo takes 3 hours of your leadership team's time. In programs, sessions take place during working hours and self-paced content fits between tasks. In a deployment, the area's expert tests and corrects each version; the FDE does the rest."}
q3 = {es = "¿Con qué IA trabajáis?", en = "Which AI do you work with?"}
a3 = {es = "Con la que ya tiene tu empresa: Microsoft 365 Copilot, ChatGPT, Claude o Gemini. Si aún no está elegida, te ayudamos a decidir.", en = "The one your company already has: Microsoft 365 Copilot, ChatGPT, Claude or Gemini. If it hasn't been chosen yet, we help you decide."}
q4 = {es = "Ya hemos hecho formación. ¿Empezamos de cero?", en = "We've already done training. Do we start from scratch?"}
a4 = {es = "Al contrario: partimos de ahí. Vemos qué se usa y qué no, y llevamos a cada perfil al siguiente nivel con sus propios casos.", en = "Quite the opposite: we build on it. We see what is being used and what isn't, and take each profile to the next level with their own cases."}
q5 = {es = "¿Qué pide el Reglamento europeo de IA?", en = "What does the EU AI Act require?"}
a5 = {es = "Desde 2025, las empresas que usan IA deben adoptar medidas para que su plantilla tenga los conocimientos necesarios. Tras la reforma de 2026 no hace falta certificar a cada persona, pero sí poder enseñar lo que se ha hecho. Nuestros programas lo dejan documentado.", en = "Since 2025, companies that use AI must take measures so their staff have the necessary knowledge. Since the 2026 reform, certifying each person is not required, but you must be able to show what has been done. Our programs document it."}
q6 = {es = "¿Cuánto cuesta?", en = "How much does it cost?"}
a6 = {es = "Depende de tu punto de partida y de hasta dónde quieras llegar: cada programa se diseña a medida. Lo vemos en una conversación de 30 minutos, sin compromiso.", en = "It depends on your starting point and how far you want to go: every program is designed to measure. We'll go through it in a 30-minute conversation, with no commitment."}

