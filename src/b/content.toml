[bfaq]
h2 = {es = "Preguntas", en = "Questions"}
p = {es = "Lo que nos preguntan los comités antes de empezar.", en = "What leadership teams ask us before they start."}
link = {es = "Escríbenos", en = "Write to us"}
q1 = {es = "¿Cuánto cuesta?", en = "How much does it cost?"}
a1 = {es = "Depende del producto y de tu punto de partida: cada uno se dimensiona contigo. En 30 minutos te proponemos un primer paso.", en = "It depends on the product and your starting point: each one is sized with you. In 30 minutes we propose a first step."}
q3 = {es = "¿Cuánto tiempo pide a nuestros equipos?", en = "How much time does it take from our teams?"}
a3 = {es = "Rumbo, un día de tu comité y tus managers. La formación va en horario de trabajo. En Spiral, el experto del área prueba cada versión y el ingeniero hace el resto.", en = "Rumbo, one day of your leadership team and managers. Training happens in working hours. In Spiral, the area’s expert tests each version and the engineer does the rest."}
q4 = {es = "¿Nuestros datos salen de la empresa?", en = "Does our data leave the company?"}
a4 = {es = "Solo por donde ya lo permite tu IT. Trabajamos en tu entorno, con las herramientas que aprueba, y preparamos la formación con acuerdo de confidencialidad o con datos ficticios.", en = "Only where your IT already allows it. We work in your environment, with the tools it approves, and prepare training under a confidentiality agreement or with fictitious data."}
q5 = {es = "¿Y si no funciona?", en = "What if it doesn’t work?"}
a5 = {es = "Empezamos por algo pequeño que se ve el mismo día: Rumbo. Si no vemos casos con valor, te lo decimos. En Spiral, cada solución se prueba con casos reales antes de usarse.", en = "We start with something small you can see the same day: Rumbo. If we don’t see valuable use cases, we tell you. In Spiral, every solution is tested on real cases before it is used."}
q6 = {es = "¿Nos quedamos con lo que se construye?", en = "Do we keep what gets built?"}
a6 = {es = "Sí. Es tuyo y vive en tu entorno, no en una plataforma nuestra. Te dejamos el manual, las pruebas y la formación para mantenerlo.", en = "Yes. It is yours and lives in your environment, not on a platform of ours. We leave you the manual, the tests and the training to maintain it."}
q7 = {es = "¿Qué pide el Reglamento europeo de IA?", en = "What does the EU AI Act require?"}
a7 = {es = "Desde 2025 pide formar a quien usa la IA. No exige certificado ni un nivel concreto, pero conviene poder enseñarlo. Alfabetización IA lo cubre y deja el registro.", en = "Since 2025 it requires training the people who use AI. It asks for no certificate or set level, but you should be able to show it. AI Literacy covers it and keeps the record."}

