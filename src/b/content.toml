# Versión B de la página (A/B testing, 18-nov-2026), construida con taste (design-taste-frontend) completo:
# su kit (assets/kit), su reparto y sus reglas de copy. Se suma al copy de A (src/content.toml): la plantilla de B
# puede usar cualquier clave de A.
# Voz: consultor directo que habla a un comité. Exacta y segura, sin adjetivos de virtud ni juegos de palabras.
# «Tú» para lo que recibe el lector, «nosotros» para el trabajo. Frases de 8 a 16 palabras.
# Reglas de taste: el título principal dice la categoría; un dato concreto en la primera pantalla; cada titular nombra
# una cosa; botones con verbo y objeto; una sola acción principal, con la misma redacción en la barra, la portada, el
# cierre y la barra del móvil; preguntas abiertas de menos de 50 palabras; las cifras con su fuente numerada.
# [DATO PENDIENTE: …] marca en la página un dato que falta. build.py --prod no lo admite.

